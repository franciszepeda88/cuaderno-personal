[build]
  command = "pip install -r requirements.txt && python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

[functions]
  directory = "netlify/functions"

# Puente de autenticación GitHub para el panel /admin (ver netlify/functions/).
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/callback"
  to = "/.netlify/functions/callback"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
