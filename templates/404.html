{% extends "base.html" %}
{% block title %}Página no encontrada — {{ site.name }}{% endblock %}
{% block content %}
<main id="main">
  <section class="lead-essay">
    <div class="wrap col reveal is-visible">
      <span class="eyebrow">Error 404</span>
      <h1 class="lead-title" style="margin-top:14px;">Esta página no existe</h1>
      <p class="dek">El ensayo que buscas pudo haberse movido o nunca existió.</p>
      <a href="{{ base_path }}index.html" class="link-arrow">← Volver al inicio</a>
    </div>
  </section>
</main>
{% endblock %}
