tagline: "Ensayos sobre filosofía, geopolítica, emprendimiento y pensamientos. "
hero_kicker: Un cuaderno personal
hero_title: Ideas para pensar más despacio y crítico
hero_sub: Ensayos cortos sobre filosofía, geopolítica, pensamientos, y algo del
  mundo del emprendimiento — publicados cada cierto tiempo, sin prisa.
bio: >
  Soy Francis Zepeda. Escribo aquí para vaciar mi mente y pensar en voz alta.
  Este cuaderno reúne ensayos sobre filosofía, un poco de geopolítica y el mundo
  del emprendimiento. Podrían parecer tres planteamientos distintos para la
  misma pregunta de raíz: ¿Cómo decidir bien con información incompleta?.
bio_extra: >
  No busco tener la última palabra, sino hacernos pensar de manera mas critica y
  dejar un rastro de cómo ha ido cambiando mi manera de ver las cosas, (quiebre
  ontológico) Tratare de publicar de manera frecuente. Y si no, al menos algunas
  notas cortas que compartiré en el camino.
pull_quote: "Porque el alma esta teñida con los pensamientos. "
