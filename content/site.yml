hero_title: Ideas para pensar más despacio
hero_sub: Ensayos cortos sobre filosofía, geopolítica y el mundo empresarial —
  publicados cada dos semanas, sin prisa.
bio: >
  Soy Francis. Escribo aquí para pensar en voz alta. Este cuaderno reúne ensayos
  sobre filosofía, geopolítica y el mundo empresarial — tres lenguajes distintos
  para la misma pregunta de fondo: cómo decidir bien con información incompleta.
bio_extra: >
  No busco tener la última palabra, sino dejar un rastro honesto de cómo va
  cambiando mi manera de ver las cosas. Publico aproximadamente cada dos
  semanas; lo demás son notas cortas que comparto en el camino.
pull_quote: Escribir es la forma más lenta de estar seguro de lo que uno piensa.
