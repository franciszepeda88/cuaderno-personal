backend:
  name: github
  repo: franciszepeda88/cuaderno-personal
  branch: main
  base_url: https://cuaderno-personal.pages.dev
  auth_endpoint: api/auth

# Se activa solo cuando el sitio corre en tu dominio de Netlify.
local_backend: true

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "posts"
    label: "Ensayos"
    label_singular: "Ensayo"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{category}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options: ["Filosofía", "Geopolítica", "Empresa", "Pensamientos"]
      - { label: "Entradilla (una frase que resuma el ensayo)", name: "dek", widget: "text" }
      - { label: "Tiempo de lectura", name: "read_time", widget: "string", default: "6 min de lectura" }
      - label: "Descripción para buscadores (SEO, opcional)"
        name: "meta_description"
        widget: "text"
        required: false
        hint: "120-155 caracteres ideal. Si la dejas vacía, se usa la entradilla."
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "fragments"
    label: "Fragmentos"
    label_singular: "Fragmento"
    folder: "content/fragments"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: date
    summary: "{{caption}}"
    sortable_fields: ["date"]
    fields:
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Imagen", name: "image", widget: "image" }
      - label: "Cita o frase (opcional)"
        name: "caption"
        widget: "string"
        required: false
        hint: "Se muestra sobre la imagen. Déjalo vacío para una imagen sin texto."
      - label: "Enlace (opcional)"
        name: "link"
        widget: "string"
        required: false
        hint: "Si quieres que la imagen lleve a un ensayo o a otro sitio al hacer clic."

  - name: "site"
    label: "Ajustes del sitio"
    editor: { preview: false }
    files:
      - name: "config"
        label: "General"
        file: "content/site.yml"
        fields:
          - label: "Favicon (ícono de la pestaña)"
            name: "favicon"
            widget: "image"
            required: false
            hint: "Imagen cuadrada, idealmente 512×512px o similar. Si la dejas vacía, se usa el ícono azul con la F."
          - { label: "Tu nombre", name: "name", widget: "string" }
          - { label: "Logotipo en texto (usa · para el punto)", name: "wordmark", widget: "string" }
          - { label: "Frase debajo del logo", name: "tagline", widget: "string" }
          - { label: "Etiqueta pequeña sobre el título del hero", name: "hero_kicker", widget: "string" }
          - { label: "Título grande del hero", name: "hero_title", widget: "string" }
          - { label: "Subtítulo del hero", name: "hero_sub", widget: "text" }
          - { label: "Biografía — párrafo 1", name: "bio", widget: "text" }
          - { label: "Biografía — párrafo 2", name: "bio_extra", widget: "text" }
          - { label: "Cita destacada", name: "pull_quote", widget: "string" }
          - { label: "Iniciales (círculo de la sección Sobre mí)", name: "initials", widget: "string" }
          - label: "Foto de perfil (sección Sobre mí)"
            name: "profile_photo"
            widget: "image"
            required: false
            hint: "Si la dejas vacía, se muestran tus iniciales en un círculo de color."
          - label: "Imagen de fondo del hero"
            name: "hero_image"
            widget: "image"
            required: false
            hint: "Foto o diseño para el fondo de portada. Si la dejas vacía, se usa el degradado azul animado."
          - { label: "Año (para el copyright)", name: "year", widget: "number" }
          - label: "Token de Cloudflare Web Analytics (opcional)"
            name: "cf_analytics_token"
            widget: "string"
            required: false
            hint: "De Cloudflare → Analytics & Logs → Web Analytics → Add a site. Déjalo vacío para no medir nada."
          - label: "Temas (los 4 recuadros de 'En qué escribo')"
            name: "topics"
            widget: "list"
            fields:
              - { label: "Número", name: "index", widget: "string" }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Descripción", name: "desc", widget: "text" }
          - label: "Redes sociales"
            name: "social"
            widget: "list"
            fields:
              - { label: "Plataforma", name: "platform", widget: "string" }
              - { label: "@usuario o URL corta a mostrar", name: "handle", widget: "string" }
              - { label: "Descripción", name: "desc", widget: "string" }
              - { label: "Enlace completo", name: "url", widget: "string" }
          - { label: "Título del boletín", name: "newsletter_title", widget: "string" }
          - { label: "Descripción del boletín", name: "newsletter_desc", widget: "text" }
          - { label: "Enlace del boletín (tu Substack)", name: "newsletter_url", widget: "string" }
          - { label: "Nota del pie de página", name: "footer_note", widget: "string", hint: "El © y tu nombre se agregan solos después de esto." }
